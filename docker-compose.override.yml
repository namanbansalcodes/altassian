version: '3.8'

services:
  frontend-svelte:
    build:
      context: ./frontend-svelte
    image: altassian-frontend-svelte:latest
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_PROXY_TARGET=http://backend:8000
      - VITE_API_BASE=/api
    volumes:
      - ./frontend-svelte:/app
    working_dir: /app
    depends_on:
      - backend
