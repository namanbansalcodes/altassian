upstream backend {
    server backend:8000;
}

upstream frontend_svelte {
    server frontend-svelte:5173;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    # API and admin requests → Django backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # User-uploaded media
    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=300";
    }

    # SvelteKit built assets (proxied) — cache aggressively
    location ^~ /assets/ {
        proxy_pass http://frontend_svelte;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Everything else → SvelteKit app; HTML no-store
    location / {
        proxy_pass http://frontend_svelte;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
}
