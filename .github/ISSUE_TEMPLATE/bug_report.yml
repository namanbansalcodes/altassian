name: Bug report
description: Report a bug to help us improve
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide steps so we can reproduce.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, Docker or local
