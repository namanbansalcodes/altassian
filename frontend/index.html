<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Altassian is a Git-powered workspace for docs, decisions, and discovery. Blazing-fast search, version history, and a modern editor — without the bloat." />
    <meta name="keywords" content="knowledge base, team wiki, documentation platform, Git-powered workspace, version control docs, collaborative editing, team knowledge management, Confluence alternative" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Altassian" />
    <link rel="canonical" href="https://altassian.com/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Altassian — Your team's knowledge, beautifully organized" />
    <meta property="og:description" content="Git-powered workspace for docs, decisions, and discovery. Blazing-fast search, version history, and a modern editor." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Altassian" />
    <meta property="og:url" content="https://altassian.com/" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Altassian — Your team's knowledge, beautifully organized" />
    <meta name="twitter:description" content="Git-powered workspace for docs, decisions, and discovery." />
    <title>Altassian — Git-Powered Team Knowledge Base</title>
  </head>
  <body>
    <script>
      // No-flash: apply dark class + data-theme before any rendering
      (function(){
        document.documentElement.classList.add('no-transitions');
        var t = localStorage.getItem('altassian-theme');
        var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        if (isDark) document.documentElement.classList.add('dark');
        requestAnimationFrame(function(){ document.documentElement.classList.remove('no-transitions'); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
